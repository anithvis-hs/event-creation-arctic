<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic AI - New Event</title>
  <link rel="stylesheet" href="styles.css">
  <script src="event-editor-shell.js" defer></script>
  <script src="integrations.js" defer></script>
  <script src="event-admin.js" defer></script>
</head>
<body class="event-page">
  <div class="app-container">
    <div class="background">
      <div class="background-inner">
        <div class="background-gradient"></div>
      </div>
    </div>

    <main class="workspace-panel" aria-label="New Event workspace">
      <header class="content-pane-header content-pane-header-workspace">
        <div class="workspace-header-copy">
          <h1>New Event</h1>
        </div>
        <div class="workspace-header-actions">
          <span class="workspace-save-status" id="event-admin-meta" aria-live="polite"></span>
          <a class="home-task-action workspace-link-action" href="index.html#events-workspace">Back to Home</a>
          <button type="button" class="workspace-quiet-action" id="workspace-save-button">Save</button>
          <button type="button" class="home-task-action" id="workspace-review-button">Review</button>
          <button type="button" class="home-task-action home-task-action-primary" id="workspace-publish-button">Publish</button>
          <div class="workspace-overflow">
            <button type="button" class="event-toolbar-icon" id="workspace-overflow-toggle" aria-label="More event actions" aria-haspopup="menu" aria-expanded="false" aria-controls="workspace-overflow-menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
            </button>
            <div class="workspace-overflow-menu" id="workspace-overflow-menu" role="menu" aria-hidden="true">
              <button type="button" class="workspace-overflow-item is-destructive" id="event-admin-close-button" role="menuitem">Discard event</button>
            </div>
          </div>
        </div>
      </header>
      <div class="content-pane-divider"></div>
      <section class="workspace-event-preview is-hidden" id="event-publish-success-summary" aria-live="polite"></section>
      <section class="workspace-event-editor" aria-label="Event setup">
        <div id="event-editor-root"></div>
      </section>
    </main>
  </div>
</body>
</html>
